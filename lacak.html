
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Lacak Lokasi</title>
</head>
<body>
    <h2>Melacak lokasi Anda...</h2>
    <p id="status">Memuat lokasi...</p>

    <script>
        function sendLocation(latitude, longitude) {
            fetch('/kirim', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ latitude, longitude })
            })
            .then(response => response.json())
            .then(data => {
                if (data.status === 'OK' && data.whatsapp_link) {
                    document.getElementById('status').innerText = "Membuka WhatsApp...";
                    window.location.href = data.whatsapp_link;
                } else {
                    document.getElementById('status').innerText = "Gagal mengirim lokasi.";
                }
            })
            .catch(error => {
                document.getElementById('status').innerText = "Terjadi kesalahan: " + error;
            });
        }

        function getLocation() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    (pos) => {
                        const lat = pos.coords.latitude;
                        const lon = pos.coords.longitude;
                        document.getElementById('status').innerText = `Lokasi ditemukan: (${lat}, ${lon})`;
                        sendLocation(lat, lon);
                    },
                    (err) => {
                        document.getElementById('status').innerText = "Gagal mengambil lokasi: " + err.message;
                    }
                );
            } else {
                document.getElementById('status').innerText = "Geolocation tidak didukung browser ini.";
            }
        }

        window.onload = getLocation;
    </script>
</body>
</html>
